services:
  magic-life:
    build: .
    image: magic-life:latest
    restart: unless-stopped
    # Nginx Proxy Manager on ANOTHER host forwards to http://<this-host-ip>:<HOST_PORT>.
    # Optional HOST_BIND limits the port to one address (e.g. the LAN/VPN IP); Docker-published
    # ports bypass ufw/firewalld rules.
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-18040}:8080"
    environment:
      MAX_ROOMS: "500"
