services:
  magic-life:
    build: .
    image: magic-life:latest
    restart: unless-stopped
    # Nginx Proxy Manager on ANOTHER host forwards to http://<this-host-ip>:${HOST_PORT}.
    # Set HOST_BIND to this host's LAN/VPN IP so the plain-HTTP port is not public.
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    environment:
      MAX_ROOMS: "500"
